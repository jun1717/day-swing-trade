# =============================================================
# experimental.yaml
#
#   !!! ここにある値は「確定した売買ルール」ではない !!!
#
# すべて暫定値。実際の日足を見て「拾ってほしい銘柄が落ちた」「不自然な
# レンジを拾った」というフィードバックで調整していくための場所。
# ここの数値を根拠に売買判断をしないこと。
#
# YAML にキーを足せばコード変更なしで参照できる（cfg.section.key）。
# =============================================================

# -------------------------------------------------------------
# MA25 を「上向き」と判定する方法（CODEX_HANDOFF §10 未確定）
# -------------------------------------------------------------
ma_slope:
  method: vs_n_days_ago   # vs_n_days_ago | linreg
  lookback: 5             # 何営業日前と比較するか。大きくすると判定が鈍く（安定）なる
  min_slope_pct: 0.0      # この%を超えて上昇していれば up。上げるとトレンド判定が厳しくなる

# -------------------------------------------------------------
# swing high / swing low の検出方法（CODEX_HANDOFF §11 未確定）
# -------------------------------------------------------------
swing:
  method: fractal         # fractal | zigzag
  pivot_window: 2         # fractal: 左右何本より高い/安いかで pivot とするか
                          #   大きくすると pivot が減り、大きな波だけを見る
  zigzag_pct: 3.0         # zigzag: 何%の反転で pivot 確定とするか
  lookback_bars: 60       # swing 検出に使う直近本数

# -------------------------------------------------------------
# 上昇トレンドの必須条件（CODEX_HANDOFF §10）
#   swing 検出アルゴリズムが未確定なため、高値/安値切り上げは初期値では
#   「必須にしない（参考表示のみ）」。取りこぼしを避けることを優先する。
# -------------------------------------------------------------
trend:
  require_close_above_ma: true
  require_ma_up: true
  require_higher_highs: false
  require_higher_lows: false

# -------------------------------------------------------------
# レンジ上限/下限 zone の許容幅（CODEX_HANDOFF §14 未確定）
#   レンジ境界は一点ではなく価格帯として扱う。
#   広げると下限反応回数が増え、NEAR が出やすくなる。
# -------------------------------------------------------------
range_zone:
  lower_tolerance_pct: 0.7
  upper_tolerance_pct: 0.7

# -------------------------------------------------------------
# レンジ品質の評価と除外条件（CODEX_HANDOFF §12, §13 未確定）
# -------------------------------------------------------------
range_quality:
  max_width_pct: 10.0              # これより広い値幅はレンジとみなさない
  min_width_pct: 1.0               # これより狭いのは動きがなさすぎる
  max_volatility_change: 1.15      # 後半/前半の日中値幅比。1.0超=拡大。上げると緩くなる
  reject_consecutive_lower_lows: 3 # 安値が何本連続で切り下がったら除外するか
  big_bearish_body_pct: 3.0        # 大陰線とみなす実体下落率(%)
  big_bearish_volume_ratio: 1.8    # 出来高急増とみなす20日平均比
  min_quality: 0.45                # この品質未満なら「良いレンジなし」= OUT
  weights:                         # 品質スコアの重み（合計で正規化される）
    narrowness: 0.25               # 値幅が狭いほど高評価
    lower_touches: 0.30            # 下限反応が多いほど高評価（最重要）
    volatility_contraction: 0.20   # 値幅収縮ほど高評価
    volume_contraction: 0.15       # 出来高減少ほど高評価
    duration: 0.10                 # 日数が長いほど僅かに高評価

# -------------------------------------------------------------
# 「下限付近」の距離（CODEX_HANDOFF §17 未確定）
# -------------------------------------------------------------
near:
  lower_threshold_pct: 2.0   # 下限から何%以内を「下限付近」とするか。上げるとNEARが増える
  lookback_days: 3           # 直近何営業日以内の下限zone接触も NEAR とみなすか
                             #   0 にすると CODEX_HANDOFF の厳密定義（当日のみ）に戻る
                             #   反発すると価格は下限から離れるため、0 では
                             #   ENTRY_CANDIDATE が成立しにくい点に注意
  break_tolerance_pct: 1.5   # 下限をこの%超で下抜けたらレンジ崩壊とみなし OUT

  # レンジ内位置ガード（0=下限, 1=上限）。この値より上なら NEAR/ENTRY にしない。
  #   距離(%)だけで見ると、レンジ幅が広い銘柄では「下限から+7%」でも実際には
  #   上限に張り付いている状態を拾ってしまう。それは CODEX_HANDOFF §21 が新規
  #   エントリーに使わないと明記した「レンジ上限ブレイク」そのもの。
  #   上げると候補が増えるが、上限付近での ENTRY を許すことになる。
  #   null にすると無効（v0.1 では有効を推奨）。
  max_position_in_range: 0.65

  # 下限zone接触後、既にこの%以上離れていたら lookback 経由の NEAR にしない。
  #   max_position_in_range がレンジ幅相対のガード、こちらは絶対距離のガード。
  #   null で無効。
  lookback_max_distance_pct: null

# -------------------------------------------------------------
# 出来高の補助評価（CODEX_HANDOFF §16 未確定）
#   出来高だけで売買判定はしない。表示と並び順の補助のみ。
# -------------------------------------------------------------
volume:
  contract_ratio: 0.80   # レンジ平均/レンジ前平均 がこれ以下なら「減少傾向」= 高評価
  expand_ratio: 1.30     # これ以上なら「増加」= レンジとしては注意
  recovery_ratio: 1.20   # 当日出来高が5日平均のこの倍以上なら「出来高回復」

# -------------------------------------------------------------
# 反発確認の加点材料（CODEX_HANDOFF §18）
#   rebound_confirmed = close > 前日高値 は確定ルール（config側の扱い）。
#   以下は加点材料の判定閾値であり、単独では ENTRY 判定しない。
# -------------------------------------------------------------
rebound:
  long_lower_wick_ratio: 1.5   # 下ヒゲ / 実体 がこの倍以上なら「長い下ヒゲ」

# -------------------------------------------------------------
# トレンド強度（並び順の第2キー。売買条件ではない）
# -------------------------------------------------------------
trend_strength:
  deviation_weight: 0.5   # MA25乖離率の寄与
  slope_weight: 0.5       # MA25傾きの寄与
  deviation_cap_pct: 15.0 # 乖離率の正規化上限
  slope_cap_pct: 5.0      # 傾きの正規化上限
